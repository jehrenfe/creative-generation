<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — The Creative Generation</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:sans-serif; min-height:100vh; background:linear-gradient(135deg,#FF6B6B,#FF9A5C,#FFD166); display:flex; align-items:center; justify-content:center; padding:24px; }
    .box { background:white; border-radius:20px; padding:40px; width:100%; max-width:360px; box-shadow:0 8px 32px rgba(0,0,0,0.15); text-align:center; }
    .logo { font-size:28px; margin-bottom:8px; }
    h1 { font-size:20px; font-weight:700; color:#2C1810; margin-bottom:4px; }
    p { font-size:13px; color:#A07060; margin-bottom:28px; }
    label { display:block; text-align:left; font-size:11px; font-weight:600; color:#A07060; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px; margin-top:14px; }
    input { width:100%; padding:10px 14px; border-radius:10px; border:1.5px solid #FFD0A0; font-size:14px; color:#2C1810; outline:none; }
    input:focus { border-color:#FF9A5C; }
    button { width:100%; margin-top:20px; background:linear-gradient(135deg,#FF6B6B,#FF9A5C); color:white; border:none; padding:12px; border-radius:24px; font-size:14px; font-weight:600; cursor:pointer; }
    .error { color:#FF6B6B; font-size:13px; margin-top:12px; display:none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">✦</div>
    <h1>The Creative Generation</h1>
    <p>Admin panel — crew only!</p>
    <form id="login-form">
      <label>Your name</label>
      <input type="text" id="username" placeholder="e.g. Xenia" required/>
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" required/>
      <button type="submit">Log in</button>
      <div class="error" id="error-msg">Wrong name or password. Try again!</div>
    </form>
  </div>
  <script>
    const CREW = {
      'xenia':   'creative2024',
      'lulu':    'creative2024',
      'martina': 'creative2024',
      'lili':    'creative2024',
      'theo':    'creative2024',
      'melody':  'creative2024',
      'admin':   'cgadmin2024',
    };
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('username').value.trim().toLowerCase();
      const pass = document.getElementById('password').value.trim();
      if (CREW[name] && CREW[name] === pass) {
        sessionStorage.setItem('cg-user', name);
        window.location.href = '/admin/cms.html';
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    });
    if (sessionStorage.getItem('cg-user')) window.location.href = '/admin/cms.html';
  </script>
</body>
</html>
