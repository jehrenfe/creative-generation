<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reading — Creative Generation</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="reader-wrap">
  <a href="javascript:history.back()" class="back-btn">← Back</a>
  <div class="reader-header">
    <div class="reader-title" id="reader-title">Loading...</div>
    <div class="reader-author" id="reader-author"></div>
  </div>
  <div id="article-container"></div>
</div>
<div id="footer-placeholder"></div>
<script src="/js/components.js"></script><script src="/js/drive.js"></script>
<script>
  const src = new URLSearchParams(window.location.search).get('src');
  if (src) loadArticle({ containerId:'article-container', src });
  else document.getElementById('article-container').innerHTML = '<p style="color:var(--mid)">No article found.</p>';
</script>
</body>
</html>
